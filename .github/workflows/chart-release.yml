name: Release Charts

on:
  workflow_dispatch:
    inputs:
      chart_ref:
        description: Git ref containing the chart to release
        required: false
        default: main
        type: string
  push:
    branches:
      - main
    paths:
      - "charts/**"

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.chart_ref || github.sha }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: add repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Package chart
        run: |
          mkdir -p .chart-release-packages
          helm dependency build charts/unit-operator
          helm package charts/unit-operator --destination .chart-release-packages
          CHART_VERSION="$(helm show chart charts/unit-operator | awk '/^version:/ { print $2 }')"
          echo "CHART_TAG=unit-operator-${CHART_VERSION}" >> "$GITHUB_ENV"
          echo "CHART_PACKAGE=.chart-release-packages/unit-operator-${CHART_VERSION}.tgz" >> "$GITHUB_ENV"
          echo "CHART_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload chart release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CHART_TAG }}
          target_commitish: ${{ env.CHART_TARGET }}
          body: Chart for upm unit-operator
          files: ${{ env.CHART_PACKAGE }}

      - name: Checkout Helm repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repository index
        run: |
          helm repo index .chart-release-packages \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHART_TAG}" \
            --merge gh-pages/index.yaml
          mv .chart-release-packages/index.yaml gh-pages/index.yaml
          cd gh-pages
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add index.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Helm chart index"
          git push origin HEAD:gh-pages
